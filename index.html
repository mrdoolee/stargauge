<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>별빛 탐사선 스타게이지호</title>
<link rel="preload" href="/fonts/Orbit-Regular.woff2" as="font" type="font/woff2" crossorigin />
<style>
/* Orbit (SIL OFL 1.1, see public/fonts/OFL.txt); block = no flash of fallback text */
@font-face{font-family:Orbit;src:url(/fonts/Orbit-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:#05070f;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#rotate{display:none;position:fixed;inset:0;z-index:10;background:#05070f;color:#fff;font:32px Orbit,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;align-items:center;justify-content:center;text-align:center}
/* shown only via the class main.js toggles (src/config/orientation.js = single source of truth) */
html.rotate #rotate{display:flex}
</style>
</head>
<body>
<div id="rotate">세로로 돌려 주세요 📱</div>
<script>document.addEventListener('contextmenu',e=>e.preventDefault());</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
